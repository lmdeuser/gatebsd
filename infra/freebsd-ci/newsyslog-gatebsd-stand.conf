# Rotation for the logs this stand writes. Nothing rotated them until
# 27 August 2026.
#
# ci-dashboard.log is the one that made this necessary: cron appends to it every
# three minutes, for ever, and it had already reached 387 KB. It lands on
# zroot/var/log -- the 48 GB root pool, not the 600 GB data pool -- so the file
# that grows without bound is the one sharing a disk with the operating system,
# sshd and syslog. A script that starts failing writes faster still.
#
# The other four are slower but equally unbounded: two nightly syncs, an hourly
# health check and a daily certificate renewal, all appending.
#
# Note the include line in /etc/newsyslog.conf: it is
# `/usr/local/etc/newsyslog.conf.d/[!.]*.conf`, so a dotted file here is NOT
# read. cron's directory is the opposite -- it takes every file, dotted ones
# included, which is how a duplicate in cron.d corrupted adblock.conf once
# already. Same shape of directory, opposite rule; check which one you are in.
#
# logfilename                     mode count size(KB) when flags
/var/log/ci-dashboard.log         644  7     1000     *    JC
/var/log/freebsd-15-amd64-sync.log 644 5     2000     *    JC
/var/log/freebsd-mirror-sync.log  644  5     2000     *    JC
/var/log/freebsd-mirror-health.log 644 5     1000     *    JC
/var/log/stand-tls-renew.log      644  3     200      *    JC
/var/log/forgejo-backup.log        640  5     500      *    JC
