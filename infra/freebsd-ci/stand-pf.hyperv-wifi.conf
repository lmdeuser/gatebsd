set skip on lo0

# During failover, force new Internet traffic sourced from the Wi-Fi address
# through hn0. LAN and the private Hyper-V network keep their connected routes.
pass out quick inet from 10.88.0.166 to { 10.88.0.0/24, 198.51.100.0/24 } keep state
pass out quick route-to (hn0 10.88.0.1) inet from 10.88.0.166 to any keep state

# Preserve the pre-PF open policy for every other packet.
pass quick all
