# poudriere(8) configuration for the delivery stand -> /usr/local/etc/poudriere.conf
#
# Deployed by install-ci-host.sh from deployment.manifest, and compared against
# this file by verify-deployment.sh. Nothing else writes it. It had three
# writers before:
#
#   bootstrap.sh installed this file wholesale over the live one.
#   ci/host/configure_freebsd_mirror.sh rewrote eleven keys in place with awk.
#   Someone, at some point, added the nine keys neither of them knows about.
#
# The third writer won, quietly, and the first two never noticed. What is
# written below is what the stand has actually been running: it was read off
# the stand itself on 6 August 2026 -- then still the physical machine, since
# decommissioned -- and every key and value here is that file's text unchanged.
# The previous content of this file was a fiction -- it had never been
# deployed, and installing it would have removed PKG_REPO_SIGNING_KEY,
# URL_BASE, POUDRIERE_HTML_DATA and the five log and URL paths below. An
# unsigned package repository is not a configuration difference: the router's
# pkg.conf asks for `signature_type: "pubkey"` and would have stopped
# installing anything at all.
#
# It also carried ALLOW_MAKE_JOBS=yes and MAX_FILES=2048, which are NOT here.
# Neither has ever been in force on this machine, and adopting them now would
# be a change to how a production build host builds, smuggled in under a fix
# about who owns a file. If they are wanted, they are a separate change with a
# separate reason.
#
# poudriere sources this as sh(1), so a comment costs nothing at build time.
#
# NOT the place for OVERLAYS=. bulk.sh sources this file and then assigns
# OVERLAYS="" unconditionally, so a setting here looks like configuration and
# silently builds the upstream version of a port this project carries itself.
# The overlay is selected with -O on each build command; see
# deployment.manifest and ci/host/configure_freebsd_mirror.sh.

# Pool and dataset layout. ZROOTFS is relative to ZPOOL, so the jails and
# packages land in tank/packages/poudriere.
ZPOOL=tank
ZROOTFS=/packages/poudriere
# The stand's own release mirror, not upstream.
#
# poudriere builds "${FREEBSD_HOST}/pub/FreeBSD/${type}/${ARCH}/${V}", which is
# exactly the shape nginx already serves out of /tank/mirror/pub/current. Until
# 27 August 2026 this pointed at download.freebsd.org, so the stand kept 158 GB
# of FreeBSD releases that nothing on the stand ever read -- every jail creation
# and every `poudriere jail -u` went out to the internet past its own copy.
#
# A machine that exists to be a local mirror has to be its own first customer.
# If it cannot serve itself, the copy is decoration, and a decoration that large
# is what filled the pool.
FREEBSD_HOST=http://mirror.example.lan
RESOLV_CONF=/etc/resolv.conf
BASEFS=/tank/packages/poudriere
USE_PORTLINT=no

# Build work happens in RAM. TMPFS_LIMIT is in gigabytes per builder, and with
# PARALLEL_JOBS=2 that is the ceiling this N100 has memory for.
USE_TMPFS="wrkdir"

DISTFILES_CACHE=/tank/mirror/distfiles
CHECK_CHANGED_OPTIONS=verbose
CHECK_CHANGED_DEPS=yes

# The key the local repository is signed with. Its public half is published to
# /tank/mirror/pkg.pub by the bring-up script and lands on the appliance as
# /usr/local/etc/pkg/keys/gatebsd-local.pub. Removing this line does not fail
# the build -- it produces an unsigned repository that the router then refuses.
PKG_REPO_SIGNING_KEY=/usr/local/etc/ssl/keys/pkg.key

# The build log web interface, served by nginx off the same host.
URL_BASE=http://mirror.example.lan/poudriere
POUDRIERE_DATA=/tank/packages/poudriere/data
POUDRIERE_HTML_DATA=/usr/local/share/poudriere/html
POUDRIERE_LOG_PATH=/tank/packages/poudriere/data/logs
POUDRIERE_LOG_PATH_STATIC=/tank/packages/poudriere/data/logs/bulk
POUDRIERE_LOG_URL=/data
POUDRIERE_DATA_URL=/data
POUDRIERE_LOG_HTML_URL=/poudriere
POUDRIERE_HTML_URL=/poudriere

# Two builders on four cores, deliberately. The stand also serves the mirror,
# the release packages and Forgejo, and a build that saturates it makes the
# pipeline it is running for time out.
PARALLEL_JOBS=2
PREPARE_PARALLEL_JOBS=2
TMPFS_LIMIT=2
