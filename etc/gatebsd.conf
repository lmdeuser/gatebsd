# GateBSD configuration
# Installed to: /usr/local/etc/gatebsd/gatebsd.conf
# Sourced by rc.d/gatebsd

# Web UI listen address and port.
# Default is loopback-only because nginx is the public entrypoint.
gatebsd_host="127.0.0.1"
gatebsd_port="8080"

# Sample interval for background agent (seconds)
gatebsd_sample_interval="60"

# Database directory
gatebsd_db="/var/db/gatebsd"

# Unix socket path (agent ↔ UI)
gatebsd_socket="/var/run/gatebsd/agent.sock"

# Authentication: system (root or members of gatebsd_admin_group) or password (separate hash)
gatebsd_auth_mode="system"
gatebsd_admin_group="wheel"
# Create /var/db/gatebsd/auth.hash with: gatebsd-passwd
