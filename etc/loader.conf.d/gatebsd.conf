# GateBSD loader settings.
#
# Kept out of /boot/loader.conf on purpose: that file is the operator's, and
# two writers on one file is the failure this product keeps paying for. The
# lua loader processes /boot/loader.conf.d/*.conf -- note the suffix rule,
# which is nginx's `include conf.d/*.conf` and not cron(8) or rcorder(8):
# a backup copy named gatebsd.conf.bak here is inert, one in cron.d is not.

# The ZTE MSM stick (0x19d2:0x1405) presents its LTE modem as CDC Ethernet on
# interface 0 and, on interface 2, a "zero-CD" virtual CD-ROM plus an empty
# card slot. Only the modem is wanted. The storage function is not merely
# clutter: the empty slot answers every size query with NOT READY, and the
# router's logs carried 171 such lines. UQ_MSC_IGNORE keeps umass(4) off the
# device; cdce(4) still claims interface 0, so ue0 comes up unchanged.
#
# Verified on the live router: detaching umass from interface 2 by hand
# removed cd0 and da0 while ue0 and the backup channel stayed up.
hw.usb.quirk.0="0x19d2 0x1405 0 0xffff UQ_MSC_IGNORE"

# Do not hold the root mount for USB enumeration.
#
# usb(4) registers a root-mount hold so that a system whose root is on USB
# waits for it. This device's root is on the internal SATA disk; it has never
# been on USB and an appliance's is not going to be. The hold therefore buys
# nothing here and costs everything: a USB device that does not finish
# enumerating blocks the mount forever, and the machine never boots.
#
# Not hypothetical. 2026-08-01, after a power cut, the production router sat
# at
#
#     Root mount waiting for: usbus0
#
# through repeated attempts. ada1 had been found and sized; the kernel was
# waiting on a MediaTek dongle that enumerates as <MediaTek Flash autorun>, a
# zero-CD device, on a loose connector. Reseating it by hand let the boot
# continue. A customer would have had a dead router and no way to know that
# wiggling a WiFi stick was the cure -- the screen names the bus, not the
# device that is holding it.
#
# The one thing that would make this line wrong is root on USB. If that ever
# becomes a supported layout, this must go with it.
hw.usb.no_boot_wait="1"
