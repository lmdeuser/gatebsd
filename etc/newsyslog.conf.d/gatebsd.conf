# GateBSD log rotation — rotate at 1 MB, keep 5 copies, compress
/var/log/gatebsd-watchdog.log  644  5  1024  *  Z  /var/run/gatebsd/watchdog.pid
/var/log/gatebsd-ui.log       600  5  1024  *  Z
/var/log/gatebsd-agent.log    644  5  1024  *  Z
/var/log/gatebsd-failover.log 644  5  1024  *  Z
/var/log/gatewayctl.log       644  5  1024  *  Z
/var/log/ru-bypass.log        644  3  1024  *  Z
# gatebsd-recovery.log is appended to by cron every single minute; unrotated it
# is the one log on this box that grows without bound and fills /var.
/var/log/gatebsd-recovery.log 600  5  1024  *  Z
/var/log/gatebsd-upgrade.log  644  5  1024  *  Z
/var/log/gatebsd-adblock.log  644  3  1024  *  Z
/var/log/gatebsd-ssl-renew.log 600  5  1024  *  Z
/var/log/gatebsd-reverse-ssh.log 600  5  1024  *  Z
