security.bsd.see_other_uids=0
security.bsd.see_other_gids=0
security.bsd.see_jail_proc=0
security.bsd.unprivileged_read_msgbuf=0
security.bsd.unprivileged_proc_debug=0
security.bsd.hardlink_check_uid=1
security.bsd.hardlink_check_gid=1

kern.randompid=1

vfs.zfs.vdev.min_auto_ashift=12

# Network hardening
net.inet.icmp.drop_redirect=1
net.inet.ip.redirect=0
net.inet.ip.sourceroute=0

# Network stack
net.isr.dispatch=deferred

# FIB 0 carries traffic; FIB 1 and FIB 2 exist so the watchdog can measure the
# primary and backup uplinks independently of the system default route. The
# earlier duplicate net.fibs=2 line was dead -- sysctl.conf is applied in order,
# so only the last assignment survived.
net.fibs=3
kern.ipc.somaxconn=1024
net.inet.tcp.blackhole=2
net.inet.udp.blackhole=1

# ARP security
net.link.ether.inet.log_arp_movements=0
net.link.ether.inet.max_age=600
net.link.ether.inet.maxtries=3
net.link.ether.inet.wait=5

# Network tuning (inspired by pfSense)
net.inet.tcp.sendspace=65536
net.inet.udp.maxdgram=57344
net.inet.tcp.delayed_ack=0
net.inet.ip.random_id=1
net.inet.tcp.drop_synfin=1
net.inet.ip.process_options=0
